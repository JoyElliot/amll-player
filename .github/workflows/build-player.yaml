name: 构建单个 PR 视觉测试版
run-name: "PR #77 · Windows 视觉测试 · ${{ github.run_number }}"

on:
  push:
    branches: [codex/visual-pr-77]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-test-${{ github.ref }}
  cancel-in-progress: true

env:
  VISUAL_TEST_PR: "77"
  VISUAL_TEST_SOURCE_SHA: "0ba4b76302ff0b235feea5597c5db6ef8217ed62"

jobs:
  windows:
    name: "PR #77 Windows x64"
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: 检出测试分支
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 核对 PR 源代码
        run: |
          $source = $env:VISUAL_TEST_SOURCE_SHA
          $parent = (git rev-parse 'HEAD^').Trim()
          if ($LASTEXITCODE -ne 0 -or $parent -ne $source) {
            throw '测试分支的父提交与指定 PR 不一致'
          }
          $changedPaths = @(git diff --name-only $source HEAD)
          if ($LASTEXITCODE -ne 0) { throw '无法比较 PR 源代码' }
          $unexpected = @($changedPaths | Where-Object {
            $_ -notin @('.github/workflows/build-player.yaml', 'VISUAL-TEST.md')
          })
          if ($unexpected.Count -gt 0) {
            throw "测试分支混入了产品代码改动：$($unexpected -join ', ')"
          }
          "PR #$env:VISUAL_TEST_PR 源提交：$source" >> $env:GITHUB_STEP_SUMMARY

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 构建
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: visual-test-windows-x64

      - name: 配置 libclang
        run: |
          $clangPath = Join-Path $env:ProgramFiles 'LLVM/bin'
          if (-not (Test-Path (Join-Path $clangPath 'libclang.dll'))) {
            throw "找不到 libclang.dll：$clangPath"
          }
          "LIBCLANG_PATH=$clangPath" >> $env:GITHUB_ENV

      - name: 安装前端依赖
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw '前端依赖安装失败' }

      - name: 检查前端类型
        run: |
          pnpm -F player exec tsgo --noEmit
          if ($LASTEXITCODE -ne 0) { throw '前端类型检查失败' }

      - name: 检测此 PR 的前端专项测试
        id: tests
        run: |
          $testFiles = @(Get-ChildItem packages/player/tests -Filter '*.test.mjs' -File -ErrorAction SilentlyContinue)
          "frontend=$($testFiles.Count -gt 0)".ToLowerInvariant() >> $env:GITHUB_OUTPUT
          if ($testFiles.Count -eq 0) {
            '该 PR 没有前端专项测试文件；前端类型检查和生产构建照常执行。' >> $env:GITHUB_STEP_SUMMARY
          }

      - name: 运行此 PR 的前端专项测试
        if: steps.tests.outputs.frontend == 'true'
        run: |
          $testFiles = @(Get-ChildItem packages/player/tests -Filter '*.test.mjs' -File | ForEach-Object FullName)
          if ($testFiles.Count -eq 0) { throw '前端测试文件意外缺失' }
          node --test @testFiles
          if ($LASTEXITCODE -ne 0) { throw '前端专项测试失败' }

      - name: 检查暂停跳转回归测试
        if: env.VISUAL_TEST_PR == '77'
        run: |
          cargo test --locked -p amll-player-core --lib ffmpeg_decoder::tests
          if ($LASTEXITCODE -ne 0) { throw '音频解码器回归测试失败' }

      - name: 生成独立测试版配置
        id: config
        run: |
          $baseConfig = Get-Content packages/player/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $version = "$($baseConfig.version)-visual.pr$env:VISUAL_TEST_PR.$env:GITHUB_RUN_NUMBER"
          $configPath = Join-Path $env:RUNNER_TEMP 'tauri.visual-test.conf.json'
          @{
            productName = "AMLL Player PR $env:VISUAL_TEST_PR"
            identifier = "net.stevexmh.amllplayer.visualtest.pr$env:VISUAL_TEST_PR"
            version = $version
            bundle = @{ active = $false; createUpdaterArtifacts = $false }
            plugins = @{ updater = @{ endpoints = @() } }
          } | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $configPath -Encoding utf8NoBOM
          "path=$configPath" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: 构建 Windows 测试版
        env:
          VISUAL_TEST_CONFIG: ${{ steps.config.outputs.path }}
        run: |
          pnpm -F player tauri build --ci --no-bundle --no-sign --config "$env:VISUAL_TEST_CONFIG"
          if ($LASTEXITCODE -ne 0) { throw 'Tauri 生产构建失败' }
          if (-not (Test-Path target/release/amll-player.exe)) {
            throw '构建完成但未找到 amll-player.exe'
          }

      - name: 整理下载包与构建信息
        id: package
        env:
          VISUAL_TEST_VERSION: ${{ steps.config.outputs.version }}
        run: |
          $artifactDir = Join-Path $env:RUNNER_TEMP "amll-player-pr$env:VISUAL_TEST_PR"
          New-Item -ItemType Directory -Path $artifactDir -Force | Out-Null
          Copy-Item -LiteralPath target/release/amll-player.exe -Destination $artifactDir
          Get-ChildItem target/release -Filter '*.dll' -File |
            Where-Object Name -NE 'amll_player_lib.dll' |
            Copy-Item -Destination $artifactDir

          $commit = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $commit -ne $env:GITHUB_SHA) {
            throw '产物提交与 Actions 触发提交不一致'
          }
          $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          @{
            version = $env:VISUAL_TEST_VERSION
            branch = $env:GITHUB_REF_NAME
            commit = $commit
            sourceCommit = $env:VISUAL_TEST_SOURCE_SHA
            includedPullRequests = @([int]$env:VISUAL_TEST_PR)
            applicationIdentifier = "net.stevexmh.amllplayer.visualtest.pr$env:VISUAL_TEST_PR"
            target = 'x86_64-pc-windows-msvc'
            updaterSigning = $false
            runUrl = $runUrl
          } | ConvertTo-Json -Depth 4 | Set-Content (Join-Path $artifactDir 'build-info.json') -Encoding utf8NoBOM

          @(
            "AMLL Player PR #$env:VISUAL_TEST_PR 视觉测试版（Windows x64）"
            ''
            '解压整个下载包，然后运行 amll-player.exe。需要 Windows WebView2 Runtime。'
            "本包仅包含 PR #$env:VISUAL_TEST_PR 的产品改动；PR 源提交：$env:VISUAL_TEST_SOURCE_SHA。"
            '每个 PR 使用独立的测试数据目录，首次打开需要重新导入测试歌曲。'
            '测试版使用未签名 EXE，不提供安装包和自动更新。'
            '版本和源代码提交见 build-info.json，文件校验值见 SHA256SUMS.txt。'
          ) | Set-Content (Join-Path $artifactDir '使用说明.txt') -Encoding utf8NoBOM

          Get-ChildItem -LiteralPath $artifactDir -File |
            Where-Object Name -NE 'SHA256SUMS.txt' | Sort-Object Name | ForEach-Object {
              $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            } | Set-Content (Join-Path $artifactDir 'SHA256SUMS.txt') -Encoding utf8NoBOM

          "path=$artifactDir" >> $env:GITHUB_OUTPUT
          @(
            "### PR #$env:VISUAL_TEST_PR Windows x64 视觉测试版"
            ''
            "版本：$env:VISUAL_TEST_VERSION"
            "构建提交：$commit"
            "PR 源提交：$env:VISUAL_TEST_SOURCE_SHA"
            ''
            '下载下方 Artifact，解压后运行 amll-player.exe。首次使用需导入测试歌曲。'
          ) >> $env:GITHUB_STEP_SUMMARY

      - name: 上传 Windows 测试包
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: AMLL-Player-PR-77-windows-x64-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<title>播放页响应式验证</title>
	</head>
	<body style="margin: 0; background: #111; color: white">
		<nav style="padding: 12px; display: flex; gap: 8px">
			<button data-size="1280,720">1280 × 720</button>
			<button data-size="1280,1000">1280 × 1000</button>
			<button data-size="390,844">390 × 844</button>
			<button data-action="多人及自定义字体">设置多人及自定义字体</button>
			<button data-action="运行检查">运行当前窗口检查</button>
		</nav>
		<iframe
			title="播放器测试窗口"
			src="./transition.html"
			width="1280"
			height="720"
			style="display: block; border: 0"
		></iframe>
		<pre id="report" style="white-space: pre-wrap">等待播放器</pre>
		<script type="module">
			const frame = document.querySelector("iframe");
			const report = document.querySelector("#report");
			function updateReport() {
				const view = frame.contentWindow;
				const doc = frame.contentDocument;
				const compact = doc.getElementById("amll-compact-info");
				const full = doc.getElementById("amll-full-info");
				if (!compact || !full) return;
				const size = (node) => {
					const style = view.getComputedStyle(node);
					return { fontSize: style.fontSize, lineHeight: style.lineHeight };
				};
				report.textContent = JSON.stringify({
					viewport: [view.innerWidth, view.innerHeight],
					compact: size(compact),
					full: size(full),
					result: doc.querySelector("[data-testid=results]")?.textContent,
				}, null, 2);
			}
			frame.addEventListener("load", () => {
				const observer = new MutationObserver(updateReport);
				observer.observe(frame.contentDocument.body, {
					subtree: true,
					childList: true,
					characterData: true,
				});
				frame.contentWindow.addEventListener("resize", () => {
					frame.contentWindow.requestAnimationFrame(updateReport);
				});
				updateReport();
			});
			for (const button of document.querySelectorAll("[data-size]")) {
				button.addEventListener("click", () => {
					[frame.width, frame.height] = button.dataset.size.split(",");
				});
			}
			for (const button of document.querySelectorAll("[data-action]")) {
				button.addEventListener("click", () => {
					const control = [...frame.contentDocument.querySelectorAll("button")]
						.find((node) => node.textContent.trim() === button.dataset.action);
					control?.click();
				});
			}
		</script>
	</body>
</html>
